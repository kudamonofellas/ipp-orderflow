# nginx config for serving the built SPA behind Traefik.
# Traefik terminates TLS, so this only listens on plain 80 inside the network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback. React Router owns paths like /orders/:id, which
    # exist only in the browser — without this, refreshing or deep-linking to
    # one returns 404 because there's no such file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames (index-D0JWCLW0.js), so their contents
    # can never change under a given name — safe to cache hard.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it's the only file whose name stays the
    # same across deploys, so a cached copy would keep pointing at the old
    # asset hashes and users would never receive a new build.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Don't leak the nginx version in response headers.
    server_tokens off;
}
